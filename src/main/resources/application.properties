# Application
spring.application.name=watchlist


# JPA and Database
spring.jpa.database=postgresql

# Create tables for the local coursework setup; preserve existing data.
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:update}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/waiting_list}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Required: at least 32 UTF-8 bytes, shared with the token issuer
app.jwt.signing-key=${JWT_SIGNING_KEY}
app.jwt.ttl=${JWT_TTL:PT24H}

app.jwt.issuer=${JWT_ISSUER:Watchlist Service}
